[project]
name = "cancer-detector"
version = "0.1.0"
description = "Prostate MRI segmentation and classification research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dicom-mapper",
    "pandas>=1.5.0",
    "pyarrow>=10.0.0",
    "openpyxl>=3.0.0",
    "numpy>=1.24.0",
    "pillow>=9.4.0",
    "pydicom>=2.3.0",
    "SimpleITK>=2.2.0",
    "trimesh>=3.20.0",
    "tqdm>=4.64.0",
    "highdicom>=0.18.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "monai>=1.3.0",
    "einops>=0.7.0",
    "segmentation-models-pytorch>=0.3.3",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "loguru",
    "wandb",
    "weave",
    "optuna>=3.4.0",
    "gradio>=4.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[tool.uv.sources]
dicom-mapper = { path = "../dicom_mapper", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mri", "service", "tools"]
